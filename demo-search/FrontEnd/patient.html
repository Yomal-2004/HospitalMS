<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/jquery-4.0.0.min.js"></script>
<script src="js/patient.js"></script>

<body>
<div class="container" style="text-align: center;">
    <h1>Patient Management</h1>
</div>

<div class="container mt-5 col-6">
    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Patient ID</label>
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Patient ID Ex: P001">
    </div>
    <div class="mb-3">
        <label for="exampleFormControlInput2" class="form-label">Patient Name</label>
        <input type="text" class="form-control" id="exampleFormControlInput2" placeholder="Patient Name">
    </div>
    <div class="mb-3">
        <label for="exampleFormControlInput3" class="form-label">Gender</label>
        <input type="text" class="form-control" id="exampleFormControlInput3" placeholder="M/F">
    </div>
    <div style="display:flex; justify-content: space-between; gap:6px;">
    <div>
        <button type="button" class="btn btn-success" onclick="savePatient()">Save</button>
        <button type="button" class="btn btn-warning" onclick="updatePatient()">Update</button>
        <button type="button" class="btn btn-danger" onclick="deletePatient()">Delete</button>
    </div>
    <div>
            <input type="text" id="searchId" placeholder="Enter Patient ID: P001">
            <button type="button" class="btn btn-secondary" onclick="searchPatient()">Search</button>
            <button type="button" class="btn btn-secondary" onclick="getALLPatients()">Show All</button>
    </div>
    </div>
    <div class="mt-3">
        <div class="table-section">
            <table class="table table-bordered border-primary table-hover">
                <thead class="table-dark">
                <tr>
                    <th scope="col">PatientID</th>
                    <th scope="col">PatientName</th>
                    <th scope="col">Gender</th>
                </tr>
                </thead>
                <tbody id="patientTable">
                </tbody>
            </table>
        </div>
    </div>
    <div style="text-align:center;">
        <button type="button" style="text-align: center;" class="btn btn-primary" onclick="window.location.href='index.html'" >Home</button>
    </div>
</div>
</body>
</html>
